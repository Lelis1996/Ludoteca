name: APK Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: unzip -q ludoteca.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        working-directory: ludoteca
        run: npm ci

      - name: Montar o app
        working-directory: ludoteca
        run: npm run android:sync

      - name: Compilar APK
        working-directory: ludoteca/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ludoteca-apk
          path: ludoteca/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
